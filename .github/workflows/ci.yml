name: CI

# Solo en main y en PRs. Antes también corría en cada tag `v*`, pero un tag apunta a un
# commit que ya pasó por main: era el mismo CI dos veces por versión (y, cuando fallaba,
# dos correos). El tag sí dispara la publicación del catálogo (catalogo.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si llegan dos empujes seguidos a la misma rama, solo importa el último.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # allowScripts en package.json (npm >=11) es lo que autoriza el
      # postinstall de esbuild aquí; el npm que trae el runner puede ser
      # más viejo que el usado en desarrollo.
      - run: npm install -g npm@^11

      - run: npm ci

      # tokens.css y src/preset.js se generan desde tokens.json. Si alguien
      # los edita a mano y olvida regenerar, esto lo detecta en vez de dejar
      # que las dos copias diverjan en silencio otra vez.
      - name: Tokens sin drift respecto a tokens.json
        run: |
          npm run tokens
          git diff --exit-code -- tokens.css src/preset.js

      - name: Tamaños de fuente dentro de la escala
        run: npm run literales

      - name: Build
        run: npm run build

      - name: Humo de render
        run: npm run humo

      - name: Herramienta hrl-core-ui (init, doctor, upgrade)
        run: npm run cli

      - name: Contraste WCAG AA
        run: npm run contrast
