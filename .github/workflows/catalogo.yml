name: Catálogo

# Compila el catálogo visual (Ladle) y lo sube a la rama `catalogo`, que es la
# que publica Netlify. La rama es solo salida generada —el sitio ya
# compilado— y se sobrescribe entera en cada publicación: nadie la edita a
# mano y no contiene código fuente.
#
# Se publica al crear un tag de versión, no en cada push: el sitio público
# muestra lo que está publicado, no lo que está a medias. Para publicar sin
# tag (tras un cambio solo del catálogo): pestaña Actions → «Catálogo» →
# «Run workflow».
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # allowScripts en package.json necesita npm >=11 (ver ci.yml).
      - run: npm install -g npm@^11

      - run: npm ci

      # Netlify sirve el sitio en la raíz de su dominio, así que el base es `/`.
      - name: Compilar el catálogo
        run: npx ladle build --base /

      # Netlify lee esto al conectar la rama: como ya viene compilado, no hay
      # comando de build y se publica la propia raíz de la rama.
      - name: Configuración de Netlify
        run: |
          cat > build/netlify.toml <<'EOF'
          # Rama generada por .github/workflows/catalogo.yml en el repositorio
          # del kit. Solo contiene el sitio ya compilado: no hay nada que construir.
          [build]
            publish = "."
          EOF

      - name: Publicar en la rama catalogo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build
          git init -q -b catalogo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Catálogo de ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" catalogo
