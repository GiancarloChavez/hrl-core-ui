name: Catálogo

# Publica el catálogo visual (Ladle) en la rama gh-pages, que es la que sirve
# GitHub Pages. La rama es solo salida generada: se sobrescribe entera en cada
# publicación y nadie la edita a mano.
#
# Se publica al crear un tag de versión, no en cada push: el sitio público
# muestra lo que está publicado, no lo que está a medias. Para publicar sin
# tag (la primera vez, o tras un cambio solo del catálogo): pestaña Actions →
# «Catálogo» → «Run workflow».
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # allowScripts en package.json necesita npm >=11 (ver ci.yml).
      - run: npm install -g npm@^11

      - run: npm ci

      # Pages sirve el sitio en /<nombre-del-repositorio>/, no en la raíz: sin
      # el base, los assets se pedirían a una ruta que no existe.
      - name: Compilar el catálogo
        run: npx ladle build --base "/${GITHUB_REPOSITORY#*/}/"

      - run: touch build/.nojekyll

      - name: Publicar en gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Catálogo de ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
